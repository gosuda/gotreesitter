name: Verify fork history and advisory diagnostics
on:
  push:
    branches: ['ci/verify-fork-history-20261126-r7']
    paths: ['.github/workflows/verify-fork-history.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e18f70ff08db15f12c2c0bb1ec3d3830be3b763
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify immutable source and native gates
        run: |
          set -euo pipefail
          export GOENV=off GOCACHEPROG='' GOMAXPROCS=2 GOFLAGS=-p=1
          test "$(git rev-parse HEAD)" = 1e18f70ff08db15f12c2c0bb1ec3d3830be3b763
          test "$(git rev-parse HEAD^{tree})" = fff6cd711438b7cc306577e214fd310a98f8257b
          git rev-parse HEAD HEAD^{tree}
          gofmt -d cmd/citestplan/forkhistory_test.go cmd/citestplan/perfdiagnostics_test.go
          test -z "$(gofmt -l cmd/citestplan/forkhistory_test.go cmd/citestplan/perfdiagnostics_test.go)"
          go test ./cmd/citestplan -run '^(TestForkAPIBaseline|TestForkHistoricalReceiptObjects|TestBenchmarkCompletionAndAdvisoryDiagnostics)$' -count=1 -v
          go vet ./cmd/citestplan
          go build -o "$RUNNER_TEMP/citestplan" ./cmd/citestplan
          git diff --check
          git diff --exit-code
      - name: Reject targeted workflow regressions
        run: |
          set -euo pipefail
          export GOENV=off GOCACHEPROG='' GOMAXPROCS=2 GOFLAGS=-p=1
          git fetch --no-tags --depth=1 origin b3d1f31425682c0dd3d84dfa0fd7cf38c3dd6a39
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory

          source = Path(".github/workflows/ci.yml").read_text()
          baseline = subprocess.run(["git", "show", "b3d1f31425682c0dd3d84dfa0fd7cf38c3dd6a39:.github/workflows/ci.yml"], capture_output=True, text=True, check=True).stdout
          fetch = 'git fetch --no-tags https://github.com/odvcencio/gotreesitter.git "' + chr(36) + '{missing[@]}"'
          assert source.count(fetch) == 1
          variants: tuple[tuple[str, str, str], ...] = (
              ("blocking attribution", baseline, "^TestBenchmarkCompletionAndAdvisoryDiagnostics/diagnostic_unavailable$"),
              ("missing remote tag discovery", source.replace("          git fetch --tags --depth=1 origin\n", ""), "^TestForkAPIBaseline/fork_release_wins$"),
              ("only first receipt", source.replace(fetch, fetch.replace("missing[@]", "missing[0]")), "^TestForkHistoricalReceiptObjects$"),
              ("shallow receipts", source.replace(fetch, fetch.replace("fetch --no-tags", "fetch --no-tags --depth=1")), "^TestForkHistoricalReceiptObjects$"),
          )
          with TemporaryDirectory(prefix="workflow-mutants-") as temporary:
              for number, (name, content, selector) in enumerate(variants):
                  path = Path(temporary) / f"mutation-{number}.yml"
                  path.write_text(content)
                  result = subprocess.run(["go", "test", "./cmd/citestplan", "-run", selector, "-count=1", "-v"], env={**os.environ, "GTS_TEST_GATE_WORKFLOW": str(path)}, capture_output=True, text=True, check=False)
                  print(f"MUTATION {name}: exit {result.returncode}")
                  print(result.stdout)
                  print(result.stderr)
                  assert result.returncode == 1 and "--- FAIL: " in result.stdout, name
          PY
