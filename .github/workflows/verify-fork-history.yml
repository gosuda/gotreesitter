name: Verify fork history and advisory diagnostics
on:
  push:
    branches: ['ci/verify-fork-history-20261126-r7']
    paths: ['.github/workflows/verify-fork-history.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50c84a974e4fef3fa7ed146b0480cf63a5e78b95
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify immutable source and native gates
        run: |
          set -euo pipefail
          export GOENV=off GOCACHEPROG='' GOMAXPROCS=2 GOFLAGS=-p=1
          test "$(git rev-parse HEAD)" = 50c84a974e4fef3fa7ed146b0480cf63a5e78b95
          test "$(git rev-parse HEAD^{tree})" = 3e3f91bc22fcf628d215f65d11782b3797bd6451
          git rev-parse HEAD HEAD^{tree}
          gofmt -d cmd/citestplan/forkhistory_test.go cmd/citestplan/perfdiagnostics_test.go
          test -z "$(gofmt -l cmd/citestplan/forkhistory_test.go cmd/citestplan/perfdiagnostics_test.go)"
          go test ./cmd/citestplan -run '^(TestForkAPIBaseline|TestForkHistoricalReceiptObjects|TestBenchmarkCompletionAndAdvisoryDiagnostics)$' -count=1 -v
          go vet ./cmd/citestplan
          go build -o "$RUNNER_TEMP/citestplan" ./cmd/citestplan
          git diff --check
          git diff --exit-code
      - name: Reject targeted workflow regressions
        run: |
          set -euo pipefail
          export GOENV=off GOCACHEPROG='' GOMAXPROCS=2 GOFLAGS=-p=1
          git fetch --no-tags --depth=1 origin b3d1f31425682c0dd3d84dfa0fd7cf38c3dd6a39
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory

          source = Path(".github/workflows/ci.yml").read_text()
          baseline = subprocess.run(["git", "show", "b3d1f31425682c0dd3d84dfa0fd7cf38c3dd6a39:.github/workflows/ci.yml"], capture_output=True, text=True, check=True).stdout
          fetch = 'git fetch --no-tags https://github.com/odvcencio/gotreesitter.git "' + chr(36) + '{missing[@]}"'
          assert source.count(fetch) == 1
          variants: tuple[tuple[str, str, str], ...] = (
              ("blocking attribution", baseline, "^TestBenchmarkCompletionAndAdvisoryDiagnostics/diagnostic_unavailable$"),
              ("missing remote tag discovery", source.replace("          git fetch --tags --depth=1 origin\n", ""), "^TestForkAPIBaseline/fork_release_wins$"),
              ("only first receipt", source.replace(fetch, fetch.replace("missing[@]", "missing[0]")), "^TestForkHistoricalReceiptObjects$"),
              ("shallow receipts", source.replace(fetch, fetch.replace("fetch --no-tags", "fetch --no-tags --depth=1")), "^TestForkHistoricalReceiptObjects$"),
              ("head RSS suppressed", source.replace('"' + chr(36) + '{HEAD_RSS_BIN}" -test.run', "true -test.run"), "^TestBenchmarkCompletionAndAdvisoryDiagnostics/head_RSS_execution_fails$"),
          )
          with TemporaryDirectory(prefix="workflow-mutants-") as temporary:
              for number, (name, content, selector) in enumerate(variants):
                  path = Path(temporary) / f"mutation-{number}.yml"
                  path.write_text(content)
                  result = subprocess.run(["go", "test", "./cmd/citestplan", "-run", selector, "-count=1", "-v"], env={**os.environ, "GTS_TEST_GATE_WORKFLOW": str(path)}, capture_output=True, text=True, check=False)
                  print(f"MUTATION {name}: exit {result.returncode}")
                  print(result.stdout)
                  print(result.stderr)
                  assert result.returncode == 1 and "--- FAIL: " in result.stdout, name
          PY
      - name: Prove symlinked temporary paths preserve RSS ownership
        run: |
          set -euo pipefail
          export GOENV=off GOCACHEPROG='' GOMAXPROCS=2 GOFLAGS=-p=1
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory

          source = Path("cmd/citestplan/perfdiagnostics_test.go")
          fixed = source.read_text()
          anchor = '[ "$PWD" -ef "$RUNNER_TEMP" ]'
          assert fixed.count(anchor) == 1
          with TemporaryDirectory(prefix="rss-path-identity-") as temporary:
              root = Path(temporary)
              physical = root / "physical"
              physical.mkdir()
              link = root / "linked"
              link.symlink_to(physical, target_is_directory=True)
              environment = {**os.environ, "TMPDIR": str(link)}
              arguments = ["go", "test", "./cmd/citestplan", "-run", "^TestBenchmarkCompletionAndAdvisoryDiagnostics$", "-count=1", "-v"]
              try:
                  source.write_text(fixed.replace(anchor, '[ "$PWD" = "$RUNNER_TEMP" ]'))
                  red = subprocess.run(arguments, env=environment, capture_output=True, text=True, check=False)
                  print(f"SYMLINK BASELINE: exit {red.returncode}")
                  print(red.stdout)
                  print(red.stderr)
                  assert red.returncode == 1 and "--- FAIL: " in red.stdout
              finally:
                  source.write_text(fixed)
              green = subprocess.run(arguments, env=environment, capture_output=True, text=True, check=False)
              print(f"SYMLINK CANDIDATE: exit {green.returncode}")
              print(green.stdout)
              print(green.stderr)
              assert green.returncode == 0
          PY
          git diff --exit-code
